name: ShotCoach
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ShotCoach:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shotcoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ShotCoach uses the camera to coach your framing."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ShotCoach saves your photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
